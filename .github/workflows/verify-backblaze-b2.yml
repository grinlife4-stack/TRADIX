name: Verify Backblaze B2

on:
  workflow_dispatch:
    inputs:
      write_test:
        description: "Upload and read back a tiny retained health-check object"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install B2 adapter
        run: python -m pip install -e '.[storage]'
      - name: Verify private bucket access
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          if [ "${{ inputs.write_test }}" = "true" ]; then
            python scripts/verify_backblaze_b2.py --write-test
          else
            python scripts/verify_backblaze_b2.py
          fi
