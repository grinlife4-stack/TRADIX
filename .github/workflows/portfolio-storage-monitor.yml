name: portfolio-storage-monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Weekly report
    - cron: "0 7 1 * *" # Monthly portfolio inventory review

permissions:
  contents: read
  issues: write

concurrency:
  group: portfolio-storage-monitor
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout TRADIX monitor
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only portfolio inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTFOLIO_GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python -m tools.portfolio_storage_monitor
          --config tools/portfolio_storage_monitor/config/portfolio.json
          --output "${{ runner.temp }}/portfolio-storage-report.json"
          --publish-github-issue
