name: generate-node-lockfiles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/generate-node-lockfiles.yml"
      - "runtime/factory-executor/package.json"
      - "runtime/mission-plan-api/package.json"
      - "runtime/product-dossier-api/package.json"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate lockfiles for independently deployable packages
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix runtime/factory-executor
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix runtime/mission-plan-api
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix runtime/product-dossier-api
      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: tradix-node-lockfiles
          path: |
            runtime/factory-executor/package-lock.json
            runtime/mission-plan-api/package-lock.json
            runtime/product-dossier-api/package-lock.json
          if-no-files-found: error
          retention-days: 3
