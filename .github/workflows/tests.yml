name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ab6cf9ba108d5368844428eabbd5c492ad2e6069
          path: reference/obis-v02
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e "projects/ECOSCAN[test]"
      - run: python -m pip install -e "reference/obis-v02/projects/BRIDEX/reference/obis-python[dev]"
      - run: cd reference/obis-v02/projects/BRIDEX/reference/obis-go && go test ./... && go build -o /tmp/obis-go-peer ./cmd/obis-go-peer
      - run: python -m pytest -q tests projects/ECOSCAN/tests reference/obis-v02/projects/BRIDEX/reference/obis-python/tests
        env:
          OBIS_GO_PEER_BINARY: /tmp/obis-go-peer
