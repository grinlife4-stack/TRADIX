name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
      - run: node --test runtime/factory-executor/gvisor-runtime.test.mjs
      - run: bash -n tests/gvisor_runtime_integration.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Validate product portability design manifest
        run: python scripts/check_product_portability.py examples/hello-world/portability.json --mode design
      - name: Verify portability release gate stays closed without restore evidence
        run: |
          if python scripts/check_product_portability.py examples/hello-world/portability.json --mode release; then
            echo "Portability release gate unexpectedly passed without a verified restore"
            exit 1
          fi
