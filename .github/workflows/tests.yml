name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/tradix-wheel .
      - run: python -m pip install --no-deps --target /tmp/tradix-install /tmp/tradix-wheel/*.whl
      - run: python -c 'from importlib.resources import files; assert files("tradix.tiis").joinpath("schemas").joinpath("message.schema.json").is_file()'
