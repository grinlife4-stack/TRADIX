name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified commit
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0\n        with:\n          go-version: "1.23"\n      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, verified commit
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e "projects/BRIDEX/core[dev]"
      - run: python -m pip install -e "projects/BRIDEX/reference/obis-python[dev]"
      - run: python -m pip install -e "projects/ECOSCAN[dev]"
      - run: cd projects/BRIDEX/reference/obis-go && go test ./...\n      - run: cd projects/BRIDEX/reference/obis-go && go build -o /tmp/obis-go-peer ./cmd/obis-go-peer\n      - run: python -m pytest -q tests projects/BRIDEX/core/tests projects/BRIDEX/reference/obis-python/tests projects/ECOSCAN/tests\n        env:\n          OBIS_GO_PEER_BINARY: /tmp/obis-go-peer
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/bridex-core-wheel projects/BRIDEX/core
      - run: python -m pip install --no-deps --target /tmp/bridex-core-install /tmp/bridex-core-wheel/*.whl
      - run: PYTHONPATH=/tmp/bridex-core-install python -c "from importlib.resources import files; assert files('bridex_core').joinpath('schemas/bridge-package-manifest.schema.json').is_file()"
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/obis-wheel projects/BRIDEX/reference/obis-python
      - run: python -m pip install --no-deps --target /tmp/obis-install /tmp/obis-wheel/*.whl
      - run: PYTHONPATH=/tmp/obis-install python -c "from importlib.resources import files; assert files('obis_bridge').joinpath('schemas/message.schema.json').is_file()"
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/ecoscan-wheel projects/ECOSCAN
      - run: python -m pip install --no-deps --target /tmp/ecoscan-install /tmp/ecoscan-wheel/*.whl
      - run: PYTHONPATH=/tmp/ecoscan-install python -c "from importlib.resources import files; assert files('ecoscan').joinpath('schemas/source-registry.schema.json').is_file()"
