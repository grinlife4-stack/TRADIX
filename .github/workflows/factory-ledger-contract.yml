name: factory-ledger-contract

on:
  pull_request:
    paths:
      - "migrations/bootstrap/**"
      - "migrations/drafts/0001_factory_ledger.sql"
      - "migrations/drafts/0002_mission_plan_versions.sql"
      - "migrations/drafts/0003_intake_approval_decisions.sql"
      - "migrations/drafts/0004_worker_lease_fencing.sql"
      - "migrations/preflight/0004_worker_lease_fencing.sql"
      - "migrations/operations/**"
      - "schemas/product-dossier-v1.schema.json"
      - "tests/test_factory_ledger_sql.sh"
      - "tests/test_worker_lease_fencing_sql.sh"
      - "docs/WORKER_LEASE_FENCING_SPEC.md"
      - "runtime/factory-executor/**"
      - "examples/hello-world/**"
      - ".github/workflows/factory-ledger-contract.yml"

permissions:
  contents: read

jobs:
  postgres-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Provision non-privileged migration identity
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d tradix_test <<'SQL'
          CREATE ROLE tradix_migrator LOGIN NOCREATEROLE;
          GRANT CREATE ON DATABASE tradix_test TO tradix_migrator;
          SQL
      - name: Provision cluster roles as database administrator
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d tradix_test < migrations/bootstrap/0001_factory_roles.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d tradix_test -c "GRANT factory_executor_owner TO tradix_migrator WITH SET TRUE, INHERIT FALSE"
      - name: Apply draft ledger migrations as restricted migrator
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U tradix_migrator -d tradix_test < migrations/drafts/0001_factory_ledger.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U tradix_migrator -d tradix_test < migrations/drafts/0002_mission_plan_versions.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U tradix_migrator -d tradix_test < migrations/drafts/0003_intake_approval_decisions.sql
      - name: Verify ledger isolation, immutability, approval gates and idempotency
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash tests/test_factory_ledger_sql.sh "$POSTGRES_CONTAINER_ID"
      - name: Clear disposable ledger fixtures before lease migration
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d tradix_test -c "SET session_replication_role=replica; TRUNCATE factory.tasks CASCADE; SET session_replication_role=origin"
      - name: Verify lease migration preflight blocks active legacy work
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d tradix_test <<'SQL'
          INSERT INTO factory.tasks (
            task_id, project_id, task_key, title, request_text,
            acceptance_criteria, risk_class, approval_required, status
          ) VALUES (
            'abababab-abab-4bab-8bab-abababababab',
            '11111111-1111-4111-8111-111111111111',
            'lease-migration-preflight-ci',
            'Legacy active task preflight',
            'Verify migration refuses to adopt active work.',
            '["active work must be drained"]'::jsonb,
            'low', false, 'implementing'
          );
          INSERT INTO factory.task_attempts (
            attempt_id, task_id, attempt_number, worker_role, status, started_at
          ) VALUES (
            'acacacac-acac-4cac-8cac-acacacacacac',
            'abababab-abab-4bab-8bab-abababababab',
            1, 'implementer', 'running', clock_timestamp()
          );
          SQL
          if docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d tradix_test < migrations/preflight/0004_worker_lease_fencing.sql > /tmp/tradix-lease-preflight.log 2>&1; then
            echo "Worker lease preflight unexpectedly accepted active legacy work"
            exit 1
          fi
          grep -F "worker lease fencing preflight refused" /tmp/tradix-lease-preflight.log
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d tradix_test <<'SQL'
          DELETE FROM factory.task_attempts WHERE attempt_id = 'acacacac-acac-4cac-8cac-acacacacacac';
          DELETE FROM factory.tasks WHERE task_id = 'abababab-abab-4bab-8bab-abababababab';
          SQL
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d tradix_test < migrations/preflight/0004_worker_lease_fencing.sql
      - name: Apply worker lease fencing migration
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U tradix_migrator -d tradix_test < migrations/drafts/0004_worker_lease_fencing.sql
      - name: Test fencing tokens, stale workers, concurrency and atomic completion
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash tests/test_worker_lease_fencing_sql.sh "$POSTGRES_CONTAINER_ID"
      - name: Install the trusted factory executor dependency
        run: npm install --prefix runtime/factory-executor --ignore-scripts --no-audit --no-fund
      - name: Execute the bounded Hello World product
        env:
          DATABASE_URL: postgresql://factory_rt_onboarding:ci-only-onboarding-password@127.0.0.1:5432/tradix_test?sslmode=disable
          FACTORY_EVIDENCE_DIR: /tmp/tradix-factory-executor
        run: node runtime/factory-executor/runner.mjs examples/hello-world/product.json
      - name: Verify exact retry does not execute the product twice
        env:
          DATABASE_URL: postgresql://factory_rt_onboarding:ci-only-onboarding-password@127.0.0.1:5432/tradix_test?sslmode=disable
          FACTORY_EVIDENCE_DIR: /tmp/tradix-factory-executor
        run: |
          set -euo pipefail
          output=$(node runtime/factory-executor/runner.mjs examples/hello-world/product.json)
          printf '%s\n' "$output"
          grep -Eq "ALREADY VERIFIED task=.* attempt=.* events=7 evidence=3" <<< "$output"
      - name: Verify approval preflight blocks execution before lease acquisition
        env:
          DATABASE_URL: postgresql://factory_rt_onboarding:ci-only-onboarding-password@127.0.0.1:5432/tradix_test?sslmode=disable
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          if node runtime/factory-executor/runner.mjs examples/hello-world/approval-preflight-test.json > /tmp/tradix-approval-preflight.log 2>&1; then
            echo "Unapproved high-risk task unexpectedly executed"
            cat /tmp/tradix-approval-preflight.log
            exit 1
          fi
          grep -F "Human approval is required" /tmp/tradix-approval-preflight.log
          state=$(docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -qAt -v ON_ERROR_STOP=1 -U postgres -d tradix_test -c "SELECT t.status || '/' || a.status || '/' || (SELECT count(*) FROM factory.task_leases l WHERE l.task_id=t.task_id)::text FROM factory.tasks t JOIN factory.task_attempts a ON a.task_id=t.task_id WHERE t.task_key='hello-world-approval-preflight-v1'")
          test "$state" = "queued/queued/0"
      - name: Upload local execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradix-factory-executor-evidence
          path: /tmp/tradix-factory-executor/
          if-no-files-found: error
          retention-days: 14
