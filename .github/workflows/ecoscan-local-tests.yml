name: ECOSCAN standalone local phase one

on:
  push:
    branches:
      - feature/ecoscan-local-phase1-2026-11-20
    paths:
      - "projects/ECOSCAN/**"
      - "standards/ecoscan/0.1/**"
      - ".github/workflows/ecoscan-local-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/ECOSCAN/**"
      - "standards/ecoscan/0.1/**"
      - ".github/workflows/ecoscan-local-tests.yml"

permissions:
  contents: read

concurrency:
  group: ecoscan-standalone-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-local:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone ECOSCAN and test runner
        run: python -m pip install --disable-pip-version-check -e "projects/ECOSCAN[test]"
      - name: Run standalone ECOSCAN test suite
        run: python -m pytest -q projects/ECOSCAN/tests
      - name: Validate synthetic ecosystem registry
        run: python -m ecoscan validate-registry projects/ECOSCAN/config/ecosystem-registry.json
      - name: Run local-only synthetic scan
        run: python -m ecoscan scan --registry projects/ECOSCAN/config/ecosystem-registry.json --controls projects/ECOSCAN/config/controls.example.json --actor demo-operator --scope ecosystem --db-dir "${{ runner.temp }}/ecoscan-db" --export-dir "${{ runner.temp }}/ecoscan-export" --format both
