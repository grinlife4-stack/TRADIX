name: ECOSCAN standalone local phase one

on:
  push:
    branches:
      - feature/ecoscan-local-phase1-2026-11-20
    paths:
      - "projects/ECOSCAN/**"
      - "standards/ecoscan/0.1/**"
      - ".github/workflows/ecoscan-local-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/ECOSCAN/**"
      - "standards/ecoscan/0.1/**"
      - ".github/workflows/ecoscan-local-tests.yml"

permissions:
  contents: read

concurrency:
  group: ecoscan-standalone-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-local:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # Test-only dependency: independent OBIS peer from the consolidated
      # BRIDEX review branch. Pinned so the tested protocol implementation is reproducible.
      - uses: actions/checkout@v4
        with:
          repository: grinlife4-stack/TRADIX
          ref: 5bdd9dce0aa6cf918491e6e23875b70bf2b90661
          path: bridex-obis-reference
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build independent Go OBIS reference peer for integration tests
        run: cd bridex-obis-reference/projects/BRIDEX/reference/obis-go && go build -o /tmp/obis-go-peer ./cmd/obis-go-peer
      - name: Install independent OBIS reference peer for integration tests
        run: python -m pip install --disable-pip-version-check -e "bridex-obis-reference/projects/BRIDEX/reference/obis-python"
      - name: Install standalone ECOSCAN and test runner
        run: python -m pip install --disable-pip-version-check -e "projects/ECOSCAN[test]"
      - name: Run standalone ECOSCAN test suite, including OBIS wire integration
        run: python -m pytest -q projects/ECOSCAN/tests
        env:
          OBIS_GO_PEER_BINARY: /tmp/obis-go-peer
      - name: Validate synthetic ecosystem registry
        run: python -m ecoscan validate-registry projects/ECOSCAN/config/ecosystem-registry.json
      - name: Run local-only synthetic scan
        run: python -m ecoscan scan --registry projects/ECOSCAN/config/ecosystem-registry.json --controls projects/ECOSCAN/config/controls.example.json --actor demo-operator --scope ecosystem --db-dir "${{ runner.temp }}/ecoscan-db" --export-dir "${{ runner.temp }}/ecoscan-export" --format both
