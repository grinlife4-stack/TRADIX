name: factory-ledger-sql

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply draft to disposable PostgreSQL
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U postgres -d tradix_test < migrations/drafts/0001_factory_ledger.sql
      - name: Test constraints and append-only controls
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash tests/test_factory_ledger_sql.sh "$POSTGRES_CONTAINER_ID"
