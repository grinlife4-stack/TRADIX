name: MegaMarket Eurostat public trade sample

on:
  push:
    branches:
      - demo/megamarket-eurostat-public-trade-v0-1

permissions:
  contents: read

jobs:
  public-trade-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate parser tests without network
        run: python -m pip install pytest && python -m pytest -q tests/test_eurostat_public_trade_demo.py
      - name: Fetch and process the real public dataset
        run: python examples/mega_market/eurostat_public_trade_demo.py --start-year 2020 --end-year 2025 --output-dir artifacts/megamarket-eurostat
      - name: Preserve raw data and report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megamarket-eurostat-public-trade-demo
          path: artifacts/megamarket-eurostat/
          if-no-files-found: ignore
          retention-days: 90
