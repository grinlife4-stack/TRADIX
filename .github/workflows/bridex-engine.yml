name: bridex-engine

on:
  push:
    branches: [main]
    paths:
      - "projects/BRIDEX/engine/**"
      - "standards/bridex/**"
      - ".github/workflows/bridex-engine.yml"
  pull_request:
    paths:
      - "projects/BRIDEX/engine/**"
      - "standards/bridex/**"
      - ".github/workflows/bridex-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "projects/BRIDEX/engine[dev]"
      - run: python -m pytest -q projects/BRIDEX/engine/tests
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/bridex-wheel projects/BRIDEX/engine
      - run: python -m pip install --no-deps --target /tmp/bridex-install /tmp/bridex-wheel/*.whl
      - run: PYTHONPATH=/tmp/bridex-install python -c "from importlib.resources import files; assert files('bridex_engine').joinpath('schemas/bridge-manifest.schema.json').is_file()"
      - run: python -c "from pathlib import Path; a=Path('standards/bridex/0.1/bridge-manifest.schema.json').read_bytes(); b=Path('projects/BRIDEX/engine/src/bridex_engine/schemas/bridge-manifest.schema.json').read_bytes(); assert a == b"
      - run: PYTHONPATH=/tmp/bridex-install python -c "import sys, bridex_engine; assert 'tradix' not in sys.modules"
