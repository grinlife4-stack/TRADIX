name: dropship-foundation
on:
  push:
    paths:
      - "products/multi-market-dropship/**"
      - ".github/workflows/dropship-foundation.yml"
  pull_request:
    paths:
      - "products/multi-market-dropship/**"
      - ".github/workflows/dropship-foundation.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test products/multi-market-dropship/domain/*.test.js
