name: ecoscan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Weekly report
    - cron: "0 5 1 * *" # Monthly portfolio inventory review

permissions:
  contents: read
  issues: write

concurrency:
  group: ecoscan
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout TRADIX monitor
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ECOSCAN PostgreSQL backend
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2" "cryptography>=43"
      - name: Run read-only portfolio inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ECOSCAN_GITHUB_TOKEN: ${{ secrets.ECOSCAN_GITHUB_TOKEN }}
          ECOSCAN_DATABASE_URL: ${{ secrets.ECOSCAN_DATABASE_URL }}
          ECOSCAN_TOKEN_ENCRYPTION_KEY: ${{ secrets.ECOSCAN_TOKEN_ENCRYPTION_KEY }}
          RAILWAY_OAUTH_CLIENT_ID: ${{ secrets.RAILWAY_OAUTH_CLIENT_ID }}
          RAILWAY_OAUTH_CLIENT_SECRET: ${{ secrets.RAILWAY_OAUTH_CLIENT_SECRET }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python -m tools.ecoscan
          --config tools/ecoscan/config/ecoscan.json
          --output "${{ runner.temp }}/ecoscan-report.json"
          --publish-github-issue
