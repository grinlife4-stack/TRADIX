[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradix"
version = "0.1.0"
description = "Modular Intelligence & Decision Engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "cryptography>=43"]
storage = ["boto3>=1.34"]
ecoscan-postgres = ["psycopg[binary]>=3.2", "cryptography>=43"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
