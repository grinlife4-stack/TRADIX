[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradix"
version = "0.1.0"
description = "Modular Intelligence & Decision Engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
documents = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1"]\ngateway = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
storage = ["boto3>=1.34"]

[project.scripts]
tradix-artifact-gateway = "tools.artifact_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tradix*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
