[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obis-bridge-reference"
version = "0.1.0"
description = "Standalone OBIS 0.1 reference peer and conformance prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.22", "cryptography>=44,<47"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
obis_bridge = ["schemas/*.json"]
