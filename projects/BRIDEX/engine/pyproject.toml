[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridex-engine"
version = "0.1.0"
description = "Standalone Bridge validation and deterministic packaging tools"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bridex = "bridex_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bridex_engine = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
